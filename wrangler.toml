# Cloudflare Worker: static site + /api routes
# Name must match the deployed Worker ("quantum-gaze": custom domains quantum-gaze.ca / .com).
name = "quantum-gaze"
main = "src/worker.js"
compatibility_date = "2025-11-03"

[assets]
directory = "."
binding = "ASSETS"
# /api/* must reach the Worker even though "." also contains files; everything else is served as assets.
run_worker_first = ["/api/*"]

# Cloudflare Email Service (Email Sending) — no API key needed.
# Requires the sending domain to be onboarded once:  npx wrangler email sending enable quantum-gaze.ca
[[send_email]]
name = "EMAIL"

# Public (non-secret) configuration
[vars]
RECAPTCHA_SITE_KEY = "6LepUp8tAAAAAL6XQyO_4s7ifsPqTL9XLoanAoZf"   # reCAPTCHA Enterprise site key (same as js/config.js)

# Secrets (set with `npx wrangler secret put <NAME> --name quantum-gaze`), never in this file:
#   RECAPTCHA_SECRET_KEY  legacy/classic secret for siteverify (Enterprise keys: "Use legacy key" in Google Cloud console)
#   RECAPTCHA_PROJECT_ID + RECAPTCHA_API_KEY  alternative: Enterprise Assessments API (Google Cloud project + API key)
#   WEBHOOK_URL           optional Slack/Discord notification webhook
#   MAILCHANNELS_API_KEY  optional legacy fallback transport

[observability]
enabled = true
