<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="100%" height="100%">
  <defs>
    <linearGradient id="qgCrestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#147dbf"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="qgGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#147dbf" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon: Interlocking QG Luxury Crest -->
  <g transform="translate(10, 8)">
    <!-- Outer Glow Silhouette -->
    <path d="M40 8 L65 8 L80 23 L80 48 L65 63 L55 63 L70 78 L58 84 L46 72 L40 72 L25 57 L25 23 Z" 
          fill="none" stroke="url(#qgGlowGrad)" stroke-width="6" opacity="0.5" filter="url(#glow)"/>

    <!-- Primary 'Q' Octagonal Ring -->
    <path d="M38 12 L60 12 L74 26 L74 46 L60 60 L48 60 L62 74 L52 80 L40 68 L38 68 L24 54 L24 26 Z" 
          fill="none" stroke="url(#qgCrestGrad)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Inner 'G' Interlocking Track -->
    <path d="M52 24 L66 24 L74 32 L74 44 L60 56 L46 56 L46 42 L62 42" 
          fill="none" stroke="#f8fafc" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Center Aperture Accent Dot -->
    <circle cx="50" cy="38" r="3" fill="#00f2fe" filter="url(#glow)"/>
  </g>

  <!-- Vertical Divider -->
  <line x1="115" y1="20" x2="115" y2="80" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>

  <!-- Right Typography: QUANTUM GAZE ENTERPRISE ARCHITECTURE -->
  <text x="135" y="46" font-family="'Libre Baskerville', Georgia, serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="3">
    QUANTUM GAZE
  </text>
  <text x="136" y="70" font-family="'Nunito', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#00f2fe" letter-spacing="5.5">
    ENTERPRISE ARCHITECTURE
  </text>
</svg>
