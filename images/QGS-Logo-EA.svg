<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 100" width="100%" height="100%">
  <defs>
    <!-- Luminous Cyan & Sapphire Gradients -->
    <linearGradient id="neonCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#147dbf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="irisGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="irisGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="singularityCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#7dd3fc"/>
      <stop offset="70%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Emblem: Neural Aperture Eye "Q" (X: 10 to 95, Y: 10 to 90) -->
  <g transform="translate(10, 5)">
    <!-- Outer Eye Contour Glow -->
    <path d="M12 50 C24 25, 60 20, 84 50 C60 80, 24 75, 12 50 Z" 
          fill="none" stroke="url(#neonCyanGrad)" stroke-width="2.5" opacity="0.8" filter="url(#neonGlow)"/>

    <!-- Eye Corner Wings (Stylized) -->
    <path d="M12 50 L4 50 M84 50 L92 50" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Outer Aperture Ring Housing -->
    <circle cx="48" cy="50" r="30" fill="#050811" stroke="url(#titaniumGrad)" stroke-width="3"/>
    <circle cx="48" cy="50" r="33" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.7"/>

    <!-- Internal Aperture Blades (Spiral Iris) -->
    <!-- Blade 1 -->
    <path d="M48 24 C56 24, 66 32, 68 40 L48 50 Z" fill="url(#irisGrad1)"/>
    <!-- Blade 2 -->
    <path d="M68 40 C72 50, 68 62, 60 68 L48 50 Z" fill="url(#irisGrad2)"/>
    <!-- Blade 3 -->
    <path d="M60 68 C50 74, 38 72, 30 64 L48 50 Z" fill="url(#irisGrad1)"/>
    <!-- Blade 4 -->
    <path d="M30 64 C24 56, 26 44, 34 34 L48 50 Z" fill="url(#irisGrad2)"/>
    <!-- Blade 5 -->
    <path d="M34 34 C40 26, 46 24, 48 24 L48 50 Z" fill="url(#irisGrad1)"/>

    <!-- Inner Aperture Opening Circle -->
    <circle cx="48" cy="50" r="14" fill="#030712"/>

    <!-- Central Quantum Singularity Light Nucleus -->
    <circle cx="48" cy="50" r="12" fill="url(#singularityCore)"/>
    <!-- 4-Point Starburst Flare -->
    <path d="M48 34 L48 66 M32 50 L64 50" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M37 39 L59 61 M37 61 L59 39" stroke="#7dd3fc" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <circle cx="48" cy="50" r="3" fill="#ffffff" filter="url(#neonGlow)"/>

    <!-- Distinctive 'Q' Metallic Tail (Bevelled 45 deg) -->
    <path d="M66 66 L86 86 L74 88 L60 74 Z" fill="url(#titaniumGrad)" stroke="#00f2fe" stroke-width="1"/>
    <!-- Tail Accent Line -->
    <line x1="68" y1="70" x2="82" y2="84" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Vertical Subtle Glass Separator -->
  <line x1="125" y1="18" x2="125" y2="82" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5"/>

  <!-- Right Typography: QUANTUM GAZE ENTERPRISE AI & ARCHITECTURE -->
  <text x="148" y="46" font-family="'Libre Baskerville', Georgia, serif" font-size="25" font-weight="700" fill="#ffffff" letter-spacing="3.5">
    QUANTUM GAZE
  </text>
  <text x="149" y="71" font-family="'Nunito', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#00f2fe" letter-spacing="5.5">
    ENTERPRISE AI &amp; ARCHITECTURE
  </text>
</svg>
